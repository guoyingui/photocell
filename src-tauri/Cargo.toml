[package]
name = "photocull"
version = "1.0.1"
description = "摄影师选图程序"
authors = ["PhotoCull"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "photocull_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
flate2 = "1"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
tauri = { version = "2.11.3", features = [] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
